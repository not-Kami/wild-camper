services:
  web:
    build: .
    container_name: wild-camper-web
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    environment:
      - APACHE_DOCUMENT_ROOT=/var/www/html
      # Supabase configuration (utilise le réseau Supabase externe)
      - USE_SUPABASE=true
      - SUPABASE_URL=http://supabase-kong:8000
      - SUPABASE_KEY=${SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU}
      # Legacy MySQL (pour compatibilité - optionnel)
      - DB_HOST=db
      - DB_NAME=wildcamper
      - DB_USER=wildcamper
      - DB_PASS=wildcamper123
    networks:
      - wild-camper-network
      - supabase-network
    restart: unless-stopped

  # Legacy MySQL (optionnel - pour compatibilité avec l'ancien code)
  # Peut être désactivé en définissant USE_SUPABASE=true
  db:
    image: mariadb:10.11
    container_name: wild-camper-db
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: wildcamper
      MYSQL_USER: wildcamper
      MYSQL_PASSWORD: wildcamper123
    volumes:
      - db_data:/var/lib/mysql
      - ./database/backup/wldcamper.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - wild-camper-network
    restart: unless-stopped
    profiles:
      - legacy  # Utilisez --profile legacy pour démarrer MySQL

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: wild-camper-phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: rootpassword
    depends_on:
      - db
    networks:
      - wild-camper-network
    restart: unless-stopped
    profiles:
      - legacy  # Utilisez --profile legacy pour démarrer phpMyAdmin

volumes:
  db_data:

networks:
  wild-camper-network:
    driver: bridge
  supabase-network:
    external: true
    name: supabase-network
